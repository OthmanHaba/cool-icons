server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types image/svg+xml application/json text/css application/javascript;

  # Icons and data: public, cacheable, embeddable anywhere; SVGs can never run script.
  location /i/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location ~ ^/(icons|search)\.json$ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=3600" always;
  }
  # SPA: /icon/<slug> and anything else falls back to the app.
  location / {
    try_files $uri /index.html;
  }
}
