server {
  listen 3000;
  root /usr/share/nginx/html;
  gzip on;
  gzip_vary on;
  gzip_types image/svg+xml application/json text/css application/javascript text/plain;
  # Pre-built .gz files from build.mjs (index, JSON, assets).
  gzip_static on;

  # Browser caches 1 day, the CDN (s-maxage) a week; deploys purge the CDN.
  location /i/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=86400, s-maxage=604800, stale-while-revalidate=604800" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location ~ ^/(icons|search)\.json$ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400" always;
  }
  # Content-hashed: never changes under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  # The page itself: browsers revalidate every time, the CDN keeps it 5 minutes.
  location = /index.html {
    add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
  }
  # SPA: /icon/<slug> and anything else falls back to the app.
  location / {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri /index.html;
  }
}
